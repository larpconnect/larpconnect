services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    container_name: larpconnect-postgres
    environment:
      POSTGRES_DB: larpconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_${NJALL_DB_SECRET}}
      NJALL_DB_SECRET: ${NJALL_DB_SECRET}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d larpconnect"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: larpconnect:latest
    container_name: larpconnect-migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    environment:
      LARPCONNECT_DATA_DATABASE_MIGRATION_JDBC_URL: jdbc:postgresql://postgres:5432/larpconnect
      LARPCONNECT_DATA_DATABASE_MIGRATION_USERNAME: njall
      LARPCONNECT_DATA_DATABASE_MIGRATION_PASSWORD: njall_migration_${NJALL_DB_SECRET}
    command: ["migrate"]
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: larpconnect:latest
    container_name: larpconnect-server
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - internal
    environment:
      LARPCONNECT_DATA_DATABASE_ADMIN_JDBC_URL: jdbc:postgresql://postgres:5432/larpconnect
      LARPCONNECT_DATA_DATABASE_ADMIN_USERNAME: njall_admin
      LARPCONNECT_DATA_DATABASE_ADMIN_PASSWORD: njall_admin_${NJALL_DB_SECRET}
      LARPCONNECT_DATA_DATABASE_USERS_JDBC_URL: jdbc:postgresql://postgres:5432/larpconnect
      LARPCONNECT_DATA_DATABASE_USERS_USERNAME: njall_users
      LARPCONNECT_DATA_DATABASE_USERS_PASSWORD: njall_users_${NJALL_DB_SECRET}
      LARPCONNECT_SERVER_HOST: 0.0.0.0
      LARPCONNECT_SERVER_PORT: 8080
    command: ["server"]
    restart: unless-stopped

  haproxy:
    image: haproxy:3.1-alpine
    container_name: larpconnect-haproxy
    depends_on:
      server:
        condition: service_started
    ports:
      - "${PORT:-8080}:8080"
      - "${TLS_PORT:-8443}:8443"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./docker/haproxy/certs:/usr/local/etc/haproxy/certs:ro
    networks:
      - edge
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  edge:
  internal:
