schema: intent-driven


context: |
  Project Code Name: Njall (used for all internal name references)
  Project Published Name: LarpConnect
  
  Tech Stack:
    - Java 25 LTS
    - HA Proxy
    - Gradle (Kotlin DSL)
    - PostgreSQL 18+
    - RabbitMQ
    - Memcached 
  Core Libraries:
    - SLF4J
    - Logback
    - Apache Pekko (2.0-M4+, Scala 3)
    - Hibernate
    - Guava
    - Mug
    - Guice
    - Caffeine
    - Apache Commons
  Testing:
    - Cucumber
    - AssertJ 
    - JUnit 6+
    - Mockito
    - Testcontainers
    - Jacoco
  Linting:
    - Spotless
    - SpotBugs
    - ErrorProne
    - Checkstyle
  Project Layout:
    - Gradle multi-module project
    - `bom` (java platform) depends on all of the local modules
    - `parent` (java platform) sets the versions for all of the modules
    - `build-logic` contains core gradle patterns


rules:
  proposal:
    - Use the grill-me skill for all proposals that will affect java code.
  design:
    - Use the c4-diagrams skill
  adr:
    - Use the architectural-decision-records skill
  tasks:
    - The implementation is not complete until `./gradlew check build` passes
    - When making changes in one module ensure that tests pass before making changes in another module
  
# Project context (optional)
