openapi: 3.1.0
info:
  title: LarpConnect Root API
  version: 0.1.0
  description: Root entrypoint, health probe, and administrative management API for Project Njall
paths:
  /:
    get:
      summary: Root health check / empty response
      description: Returns HTTP 200 OK with an empty response body
      responses:
        '200':
          description: Service is reachable
          content:
            text/plain:
              schema:
                type: string
                example: ""
  /api/admin/v1/health:
    get:
      summary: Administrative runtime health probe
      description: Returns HTTP 200 OK when healthy and HTTP 500 when unhealthy or timed out, both with empty body
      responses:
        '200':
          description: System runtime is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ""
        '500':
          description: System runtime is unhealthy or probe timed out
          content:
            text/plain:
              schema:
                type: string
                example: ""
  /api/admin/v1/servers:
    get:
      summary: List registered servers and contacts
      description: Returns a list of all registered servers and their associated contact information
      responses:
        '200':
          description: List of registered servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '500':
          description: Internal server error while querying servers
          content:
            text/plain:
              schema:
                type: string

  /api/admin/v1/studios:
    get:
      summary: List registered studios
      description: Returns a list of all studios. Soft-deleted studios are excluded by default.
      parameters:
        - name: include_deleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, include soft-deleted studios in results.
      responses:
        '200':
          description: List of registered studios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudioLookup'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Register a new studio
      description: Registers a new studio with a unique canonical alias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudioRequest'
      responses:
        '201':
          description: Studio registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioLookup'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/studios/{id}:
    get:
      summary: Retrieve studio by UUID or alias
      description: Fetches a studio by studioId (UUID) or unique alias.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Studio UUID or natural alias.
        - name: include_deleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, return soft-deleted studio if matched.
      responses:
        '200':
          description: Studio retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioLookup'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/studios/{studio-id}/v1/studio:
    get:
      summary: Retrieve studio details for tenant
      description: Fetches public studio metadata for the specified studio UUID or alias. Internal tenant identifiers are never returned.
      parameters:
        - name: studio-id
          in: path
          required: true
          schema:
            type: string
          description: Public studio UUID or natural alias.
      responses:
        '200':
          description: Studio details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Studio'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/studios/{studio-id}/v1/links:
    post:
      summary: Create a studio link
      description: Creates a new external link resource for the specified studio.
      parameters:
        - name: studio-id
          in: path
          required: true
          schema:
            type: string
          description: Public studio UUID or natural alias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Link created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/studios/{studio-id}/v1/links/{id}:
    get:
      summary: Retrieve a studio link
      description: Fetches a single external link by ID for the specified studio.
      parameters:
        - name: studio-id
          in: path
          required: true
          schema:
            type: string
          description: Public studio UUID or natural alias.
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Link UUID.
      responses:
        '200':
          description: Link retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      summary: Update a studio link (AIP-134)
      description: Updates an existing studio link resource conforming to Google AIP-134.
      parameters:
        - name: studio-id
          in: path
          required: true
          schema:
            type: string
          description: Public studio UUID or natural alias.
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Link UUID.
        - name: update_mask
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of fields to update (e.g. 'url,summary').
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLinkRequest'
      responses:
        '200':
          description: Link updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      summary: Soft delete a studio link
      description: Soft deletes an existing studio link resource.
      parameters:
        - name: studio-id
          in: path
          required: true
          schema:
            type: string
          description: Public studio UUID or natural alias.
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Link UUID.
      responses:
        '204':
          description: Link deleted successfully
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/studio-roles:
    get:
      summary: List default studio roles
      description: Returns a list of all global default studio roles.
      responses:
        '200':
          description: List of default studio roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DefaultStudioRole'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Create default studio role
      description: Creates a new global default studio role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudioRoleRequest'
      responses:
        '201':
          description: Default studio role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultStudioRole'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/studio-roles/{id}:
    get:
      summary: Retrieve default studio role by ID
      description: Fetches a single default studio role by UUID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Role UUID.
      responses:
        '200':
          description: Default studio role retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultStudioRole'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      summary: Update default studio role (AIP-134)
      description: Updates an existing default studio role name conforming to Google AIP-134.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Role UUID.
        - name: update_mask
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of fields to update (e.g. 'name').
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudioRoleRequest'
      responses:
        '200':
          description: Default studio role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultStudioRole'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/users:
    get:
      summary: List administrative users
      description: Returns all administrative users and their assigned roles.
      responses:
        '200':
          description: List of administrative users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Create an administrative user
      description: Creates a user with optional status and initial roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/users/{id}:
    get:
      summary: Retrieve administrative user
      description: Fetches user by UUID or natural username.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User UUID or username.
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/users/{id}:addRole:
    post:
      summary: Assign role to user
      description: Idempotently assigns a role by roleId or roleName.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Target user UUID or username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: Role assigned successfully or already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/users/{id}:removeRole:
    post:
      summary: Remove role from user
      description: Idempotently removes a role by roleId or roleName.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Target user UUID or username.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: Role removed successfully or not assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/roles:
    get:
      summary: List administrative roles
      description: Returns all registered administrative roles.
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRole'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Create an administrative role
      description: Registers a new role with unique roleName.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRole'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /api/admin/v1/roles/{id}:
    get:
      summary: Retrieve role by UUID or roleName
      description: Fetches a role by roleId or unique roleName.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Role UUID or roleName.
      responses:
        '200':
          description: Role retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRole'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

components:
  headers:
    Traceparent:
      description: W3C Trace Context traceparent header for distributed tracing and request correlation
      schema:
        type: string
        example: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"

  responses:
    BadRequestResponse:
      description: Malformed request or validation failure
      headers:
        traceparent:
          $ref: '#/components/headers/Traceparent'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    NotFoundResponse:
      description: Requested entity not found
      headers:
        traceparent:
          $ref: '#/components/headers/Traceparent'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    ConflictResponse:
      description: Entity already exists
      headers:
        traceparent:
          $ref: '#/components/headers/Traceparent'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'
    ErrorResponse:
      description: Internal server error
      headers:
        traceparent:
          $ref: '#/components/headers/Traceparent'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminErrorResponse'

  schemas:
    AdminErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
          example: "Invalid alias format"

    StudioLookup:
      type: object
      required:
        - tenantId
        - studioId
        - alias
        - createdAt
        - updatedAt
      properties:
        tenantId:
          type: string
          format: uuid
          example: "018f2345-6789-7abc-def0-123456789abc"
        studioId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        alias:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          example: "valhalla"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true

    CreateStudioRequest:
      type: object
      required:
        - alias
      properties:
        alias:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          example: "valhalla"
        name:
          type: string
          example: "Valhalla Gaming Studio"

    Studio:
      type: object
      required:
        - studioId
        - alias
        - name
      properties:
        studioId:
          type: string
          format: uuid
          example: "018f2345-6789-7abc-def0-123456789abc"
        alias:
          type: string
          example: "valhalla"
        name:
          type: string
          example: "Valhalla Gaming Studio"

    DefaultStudioRole:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: "018f2345-6789-7abc-def0-123456789abc"
        name:
          type: string
          example: "ORGANIZER"

    CreateStudioRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "ORGANIZER"

    UpdateStudioRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "LEAD_ORGANIZER"

    AdminRole:
      type: object
      required:
        - id
        - roleName
      properties:
        id:
          type: string
          format: uuid
          example: "018f2345-6789-7abc-def0-123456789abc"
        roleName:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          example: "security_admin"

    CreateRoleRequest:
      type: object
      required:
        - roleName
      properties:
        roleName:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          example: "security_admin"

    AdminUser:
      type: object
      required:
        - id
        - username
        - status
        - createdAt
        - updatedAt
        - roles
      properties:
        id:
          type: string
          format: uuid
          example: "018f2345-6789-7abc-def0-123456789abc"
        username:
          type: string
          example: "admin_user"
        status:
          type: string
          enum: [ACTIVE, DISABLED, DELETED]
          example: "ACTIVE"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AdminRole'

    CreateUserRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          example: "admin_user"
        status:
          type: string
          enum: [ACTIVE, DISABLED, DELETED]
          default: "ACTIVE"
          example: "ACTIVE"
        roles:
          type: array
          items:
            type: string
          example: ["security_admin"]

    RoleAssignmentRequest:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
        roleName:
          type: string

    ServerContact:
      type: object
      required:
        - id
        - roleType
        - contactType
        - contact
        - ordering
      properties:
        id:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        roleType:
          type: string
          enum: [NONE, ADMIN, MODERATOR, SECURITY]
          example: "ADMIN"
        contactType:
          type: string
          enum: [EMAIL, ACTOR, PHONE, OTHER]
          example: "EMAIL"
        contact:
          type: string
          example: "admin@larpconnect.com"
        ordering:
          type: integer
          example: 0

    Server:
      type: object
      required:
        - id
        - name
        - primaryDomain
        - createdOn
        - contacts
      properties:
        id:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        name:
          type: string
          example: "Njall Primary Server"
        primaryDomain:
          type: string
          example: "larpconnect.com"
        createdOn:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ServerContact'

    Link:
      type: object
      required:
        - id
        - linkType
        - url
        - mediaType
        - createdOn
        - updatedOn
      properties:
        id:
          type: string
          format: uuid
          example: "018f2345-6789-7abc-def0-123456789abc"
        linkType:
          type: string
          example: "website"
        url:
          type: string
          format: uri
          example: "https://valiant.example.com"
        mediaType:
          type: string
          example: "text/html"
        summary:
          type: string
          example: "Official Studio Homepage"
        createdOn:
          type: string
          format: date-time
          example: "2026-09-28T12:00:00Z"
        updatedOn:
          type: string
          format: date-time
          example: "2026-09-28T12:00:00Z"

    CreateLinkRequest:
      type: object
      required:
        - linkType
        - url
      properties:
        linkType:
          type: string
          example: "website"
        url:
          type: string
          format: uri
          example: "https://valiant.example.com"
        mediaType:
          type: string
          default: "text/html"
          example: "text/html"
        summary:
          type: string
          example: "Official Studio Homepage"

    UpdateLinkRequest:
      type: object
      properties:
        linkType:
          type: string
          example: "website"
        url:
          type: string
          format: uri
          example: "https://updated.example.com"
        mediaType:
          type: string
          example: "text/html"
        summary:
          type: string
          example: "Updated Homepage"
