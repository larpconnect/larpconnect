openapi: 3.1.0
info:
  title: LarpConnect Root API
  version: 0.1.0
  description: Root entrypoint and health probe for Project Njall
paths:
  /:
    get:
      summary: Root health check / empty response
      description: Returns HTTP 200 OK with an empty response body
      responses:
        '200':
          description: Service is reachable
          content:
            text/plain:
              schema:
                type: string
                example: ""
  /api/admin/v1/health:
    get:
      summary: Administrative runtime health probe
      description: Returns HTTP 200 OK when healthy and HTTP 500 when unhealthy or timed out, both with empty body
      responses:
        '200':
          description: System runtime is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ""
        '500':
          description: System runtime is unhealthy or probe timed out
          content:
            text/plain:
              schema:
                type: string
                example: ""
  /api/admin/v1/servers:
    get:
      summary: List registered servers and contacts
      description: Returns a list of all registered servers and their associated contact information
      responses:
        '200':
          description: List of registered servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Server'
        '500':
          description: Internal server error while querying servers
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    ServerContact:
      type: object
      required:
        - id
        - roleType
        - contactType
        - contact
        - ordering
      properties:
        id:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        roleType:
          type: string
          enum: [NONE, ADMIN, MODERATOR, SECURITY]
          example: "ADMIN"
        contactType:
          type: string
          enum: [EMAIL, ACTOR, PHONE, OTHER]
          example: "EMAIL"
        contact:
          type: string
          example: "admin@larpconnect.com"
        ordering:
          type: integer
          example: 0
    Server:
      type: object
      required:
        - id
        - name
        - primaryDomain
        - createdOn
        - contacts
      properties:
        id:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        name:
          type: string
          example: "Njall Primary Server"
        primaryDomain:
          type: string
          example: "larpconnect.com"
        createdOn:
          type: string
          format: date-time
          example: "2026-01-01T00:00:00Z"
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ServerContact'
